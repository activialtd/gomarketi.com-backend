# Production stack for the EC2 host.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres is NOT here: DATABASE_URL points at Neon.
# Only Caddy publishes ports; everything else talks over gomarketi-net.
# Every service listens on 8080 inside its container.
#
# Build context is the repo ROOT for every service, because the Dockerfiles
# copy both shared/pkg/ and services/<name>/.

networks:
  gomarketi-net:
    driver: bridge

x-service: &service
  restart: unless-stopped
  env_file: .env
  networks: [gomarketi-net]
  environment:
    PORT: "8080"
  volumes:
    # RS256 keypair + Apple .p8, copied onto the host (never baked into images)
    - ./keys:/keys:ro
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [gomarketi-net]
    depends_on: [gateway]

  # Optional: only used for SSE fan-out across multiple orders instances.
  # Orders falls back to an in-memory broker if this is absent.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks: [gomarketi-net]

  gateway:
    <<: *service
    build:
      context: .
      dockerfile: services/gateway/Dockerfile

  auth:
    <<: *service
    build:
      context: .
      dockerfile: services/auth/Dockerfile

  identity:
    <<: *service
    build:
      context: .
      dockerfile: services/identity/Dockerfile

  storefront:
    <<: *service
    build:
      context: .
      dockerfile: services/storefront/Dockerfile

  catalogue:
    <<: *service
    build:
      context: .
      dockerfile: services/catalogue/Dockerfile

  orders:
    <<: *service
    build:
      context: .
      dockerfile: services/orders/Dockerfile

  # admin-api (Node/Fastify) — uncomment once it lives in this repo.
  # admin-api:
  #   <<: *service
  #   build:
  #     context: .
  #     dockerfile: services/admin-api/Dockerfile

volumes:
  caddy_data:
  caddy_config: