# Production stack for the EC2 host.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports; everything else talks over gomarketi-net.
# Every service listens on 8080 inside its container.
#
# Build context is the repo ROOT for every service, because the Dockerfiles
# copy both shared/pkg/ and services/<name>/.

networks:
  gomarketi-net:
    driver: bridge

x-service: &service
  restart: unless-stopped
  env_file: .env
  networks: [gomarketi-net]
  environment:
    PORT: "8080"
    # Storefront calls identity directly (not via the gateway) to provision a
    # vendor's Paystack virtual account right after their store is created.
    # Without this it falls back to http://localhost:8081 — inside its own
    # container, where nothing listens — and every new vendor waits for
    # identity's hourly backfill sweep instead of getting an account number
    # immediately. Harmless on the other services, which never read it.
    IDENTITY_INTERNAL_URL: "http://identity:8080"
    # Every customer-facing link in an email is built from these. Unset, orders
    # falls back to http://<slug>.localhost:3001 and https://localhost:3000 —
    # which is what shipped in real order emails until this was pinned here.
    STOREFRONT_ROOT_DOMAIN: "gomarketi.com"
    VENDOR_BASE_URL: "https://vendor.gomarketi.com"
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    # RS256 keypair + Apple .p8, copied onto the host (never baked into images)
    - ./keys:/keys:ro
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  # PostGIS build: shared/migrations/0006 does CREATE EXTENSION postgis.
  # If this image has no arm64 build, swap to imresamu/postgis:16-3.4.
  postgres:
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [gomarketi-net]
    # Modest settings for a 2 GB box shared with eight other containers
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [gomarketi-net]
    depends_on: [gateway]

  # Only used for SSE fan-out across multiple orders instances.
  # Orders falls back to an in-memory broker if this is absent.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks: [gomarketi-net]

  gateway:
    <<: *service
    build:
      context: .
      dockerfile: services/gateway/Dockerfile

  auth:
    <<: *service
    build:
      context: .
      dockerfile: services/auth/Dockerfile

  identity:
    <<: *service
    build:
      context: .
      dockerfile: services/identity/Dockerfile

  storefront:
    <<: *service
    build:
      context: .
      dockerfile: services/storefront/Dockerfile

  catalogue:
    <<: *service
    build:
      context: .
      dockerfile: services/catalogue/Dockerfile

  orders:
    <<: *service
    build:
      context: .
      dockerfile: services/orders/Dockerfile

  # admin-api (Node/Fastify) — uncomment once it lives in this repo.
  # admin-api:
  #   <<: *service
  #   build:
  #     context: .
  #     dockerfile: services/admin-api/Dockerfile

volumes:
  postgres_data:
  caddy_data:
  caddy_config: